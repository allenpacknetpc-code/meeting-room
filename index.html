<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谷源會議室預約系統 </title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-10">

    <!-- 頂部列 -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-20 flex justify-between items-center">
        <div>
            <h1 class="text-lg font-bold">會議室預約系統</h1>
            <p id="userInfo" class="text-xs text-indigo-200">未登入</p>
        </div>
        <button id="authBtn" onclick="toggleAuthModal()" class="bg-indigo-800 hover:bg-indigo-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">
            登入
        </button>
    </header>

    <!-- 主體內容 -->
    <main class="max-w-md mx-auto p-4">
        
        <!-- 管理員專區 -->
        <div id="adminPanel" class="hidden mb-4 bg-amber-50 border border-amber-200 rounded-xl p-3 flex justify-between items-center">
            <span class="text-xs font-semibold text-amber-800">👑 管理員權限已啟用</span>
            <div class="space-x-1">
                <button onclick="openRoomMgmtModal()" class="bg-amber-600 text-white text-xs px-2.5 py-1 rounded-md font-medium">管理會議室</button>
                <button onclick="openUserMgmtModal()" class="bg-slate-700 text-white text-xs px-2.5 py-1 rounded-md font-medium">帳號管理</button>
            </div>
        </div>

        <!-- 會議室分頁 -->
        <div class="flex space-x-2 overflow-x-auto pb-3 scrollbar-none" id="roomTabs">
            <div class="text-xs text-slate-400 p-2">載入會議室中...</div>
        </div>

        <!-- 月曆視圖區塊 -->
        <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-200 mb-4">
            <div class="flex justify-between items-center mb-3">
                <button onclick="changeMonth(-1)" class="p-1.5 text-slate-500 hover:bg-slate-100 rounded-lg">◀</button>
                <h2 id="calendarMonthYear" class="font-bold text-slate-700 text-sm"></h2>
                <button onclick="changeMonth(1)" class="p-1.5 text-slate-500 hover:bg-slate-100 rounded-lg">▶</button>
            </div>

            <div class="grid grid-cols-7 text-center text-xs font-bold text-slate-400 mb-1">
                <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
            </div>

            <div id="calendarDays" class="grid grid-cols-7 gap-1 text-center text-xs"></div>
        </div>

        <!-- 當日預約清單 -->
        <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-200">
            <div class="flex justify-between items-center mb-3">
                <div>
                    <span class="text-xs text-slate-400 block">已選取日期</span>
                    <h3 id="selectedDateTitle" class="font-bold text-slate-700"></h3>
                </div>
                <button onclick="openBookingModal()" class="bg-indigo-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium hover:bg-indigo-700 transition">
                    + 新增預約
                </button>
            </div>

            <div id="bookingList" class="space-y-2"></div>
        </div>
    </main>

    <!-- 登入 Modal -->
    <div id="loginModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-xs rounded-2xl p-6 shadow-xl">
            <h3 class="text-lg font-bold mb-4 text-center">使用者登入</h3>
            <input type="text" id="loginUsername" placeholder="請輸入使用者名稱" class="w-full border border-slate-300 rounded-lg p-2.5 mb-4 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            <button onclick="handleLogin()" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium text-sm mb-2">登入</button>
            <button onclick="closeModal('loginModal')" class="w-full bg-slate-100 text-slate-600 py-2 rounded-lg font-medium text-sm">取消</button>
        </div>
    </div>

    <!-- 預約 Modal -->
    <div id="bookingModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-xs rounded-2xl p-6 shadow-xl">
            <h3 class="text-lg font-bold mb-4" id="bookingModalTitle">新增預約</h3>
            <form id="bookingForm" onsubmit="handleBookingSubmit(event)">
                <input type="hidden" id="bookingId">
                <div class="mb-3">
                    <label class="block text-xs text-slate-500 font-bold mb-1">會議名稱</label>
                    <input type="text" id="meetingTitle" required class="w-full border rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="mb-3">
                    <label class="block text-xs text-slate-500 font-bold mb-1">預約人</label>
                    <input type="text" id="bookingUser" readonly class="w-full bg-slate-100 border rounded-lg p-2 text-sm text-slate-600">
                </div>
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <div>
                        <label class="block text-xs text-slate-500 font-bold mb-1">開始時間</label>
                        <input type="time" id="startTime" required class="w-full border rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 font-bold mb-1">結束時間</label>
                        <input type="time" id="endTime" required class="w-full border rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-medium mb-2">確認送出</button>
                <button type="button" onclick="closeModal('bookingModal')" class="w-full bg-slate-100 text-slate-600 py-2 rounded-lg text-sm font-medium">取消</button>
            </form>
        </div>
    </div>

    <!-- 管理員：會議室管理 Modal -->
    <div id="roomMgmtModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-xs rounded-2xl p-6 shadow-xl">
            <h3 class="text-lg font-bold mb-3">會議室分頁管理</h3>
            <div class="flex space-x-2 mb-4">
                <input type="text" id="newRoomName" placeholder="新會議室名稱" class="flex-1 border rounded-lg p-2 text-sm outline-none">
                <button onclick="handleAddRoom()" class="bg-indigo-600 text-white px-3 py-2 rounded-lg text-sm font-medium">新增</button>
            </div>
            <div id="roomList" class="max-h-48 overflow-y-auto space-y-2 border-t pt-2"></div>
            <button onclick="closeModal('roomMgmtModal')" class="w-full bg-slate-100 text-slate-600 py-2 rounded-lg text-sm font-medium mt-4">關閉</button>
        </div>
    </div>

    <!-- 管理員：使用者管理 Modal -->
    <div id="userMgmtModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-xs rounded-2xl p-6 shadow-xl">
            <h3 class="text-lg font-bold mb-3">使用者名稱設定</h3>
            <div class="flex space-x-2 mb-4">
                <input type="text" id="newUserName" placeholder="新使用者姓名" class="flex-1 border rounded-lg p-2 text-sm outline-none">
                <button onclick="handleAddUser()" class="bg-indigo-600 text-white px-3 py-2 rounded-lg text-sm font-medium">新增</button>
            </div>
            <div id="userList" class="max-h-40 overflow-y-auto space-y-1.5 border-t pt-2"></div>
            <button onclick="closeModal('userMgmtModal')" class="w-full bg-slate-100 text-slate-600 py-2 rounded-lg text-sm font-medium mt-4">關閉</button>
        </div>
    </div>

    <!-- Firebase SDK (v9/v10 Modular via CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, doc, setDoc, getDoc, onSnapshot, collection, addDoc, updateDoc, deleteDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ 請替換為您的 Firebase 專案設定值
        const firebaseConfig = {
  apiKey: "AIzaSyAXRJdvnXGB7r2RDG4CritcdvwzlEV8vsY",
  authDomain: "meeting-room-app-f612c.firebaseapp.com",
  projectId: "meeting-room-app-f612c",
  storageBucket: "meeting-room-app-f612c.firebasestorage.app",
  messagingSenderId: "489355063581",
  appId: "1:489355063581:web:494f92df92d7b957a2f1f4",
  measurementId: "G-HSYCNM362W"
};

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 全域變數
        window.rooms = [];
        window.users = [];
        window.bookings = [];
        window.currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
        window.activeRoom = "";
        window.currentDate = new Date();
        window.selectedDateStr = new Date().toISOString().split('T')[0];

        // 雲端資料監聽（即時同步核心）
        window.addEventListener('DOMContentLoaded', () => {
            initSystemData();
            listenToData();
            updateAuthUI();
        });

        // 初始化預設資料（若雲端完全沒資料時）
        async function initSystemData() {
            const configRef = doc(db, "system", "config");
            const configSnap = await getDoc(configRef);
            if (!configSnap.exists()) {
                await setDoc(configRef, {
                    rooms: ["會議室 A", "會議室 B", "會議室 C"],
                    users: [
                        { name: "admin", role: "admin" },
                        { name: "王小明", role: "user" },
                        { name: "陳大天", role: "user" }
                    ]
                });
            }
        }

        // 即時聽取雲端資料變更
        function listenToData() {
            // 聽取系統設定 (會議室/使用者)
            onSnapshot(doc(db, "system", "config"), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    window.rooms = data.rooms || [];
                    window.users = data.users || [];
                    if (!window.rooms.includes(window.activeRoom)) {
                        window.activeRoom = window.rooms[0] || "";
                    }
                    renderTabs();
                    renderUserList();
                    renderRoomList();
                    renderCalendar();
                    renderBookingList();
                }
            });

            // 即時聽取預約列表
            onSnapshot(collection(db, "bookings"), (snapshot) => {
                window.bookings = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderCalendar();
                renderBookingList();
            });
        }

        // 全域掛載 Firebase 操作 Function
        window.saveSystemConfig = async () => {
            await setDoc(doc(db, "system", "config"), {
                rooms: window.rooms,
                users: window.users
            });
        };

        window.handleBookingSubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('bookingId').value;
            const title = document.getElementById('meetingTitle').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;

            if (startTime >= endTime) {
                alert("結束時間必須晚於開始時間！");
                return;
            }

            const isConflict = window.bookings.some(b => {
                if (b.room !== window.activeRoom || b.date !== window.selectedDateStr) return false;
                if (id && b.id === id) return false;
                return (startTime < b.endTime) && (endTime > b.startTime);
            });

            if (isConflict) {
                alert("⚠️ 預約失敗：該時段與現有預約重疊！");
                return;
            }

            const bookingData = {
                room: window.activeRoom,
                date: window.selectedDateStr,
                title,
                user: window.currentUser.name,
                startTime,
                endTime
            };

            if (id) {
                await updateDoc(doc(db, "bookings", id), bookingData);
            } else {
                await addDoc(collection(db, "bookings"), bookingData);
            }

            closeModal('bookingModal');
        };

        window.deleteBooking = async (id) => {
            if (confirm("確定要刪除這筆預約嗎？")) {
                await deleteDoc(doc(db, "bookings", id));
            }
        };

        window.handleAddRoom = async () => {
            const roomName = document.getElementById('newRoomName').value.trim();
            if (roomName && !window.rooms.includes(roomName)) {
                window.rooms.push(roomName);
                await window.saveSystemConfig();
                document.getElementById('newRoomName').value = "";
            }
        };

        window.editRoomName = async (index) => {
            const oldName = window.rooms[index];
            const newName = prompt("請輸入新的會議室名稱：", oldName);
            if (newName && newName.trim() !== "" && newName !== oldName) {
                const trimmed = newName.trim();
                window.rooms[index] = trimmed;
                await window.saveSystemConfig();
                
                // 更新該會議室下既有預約紀錄
                const updates = window.bookings.filter(b => b.room === oldName);
                for (let b of updates) {
                    await updateDoc(doc(db, "bookings", b.id), { room: trimmed });
                }
            }
        };

        window.deleteRoom = async (index) => {
            const roomToDelete = window.rooms[index];
            if (confirm(`確定要刪除「${roomToDelete}」嗎？`)) {
                window.rooms.splice(index, 1);
                await window.saveSystemConfig();

                const toDelete = window.bookings.filter(b => b.room === roomToDelete);
                for (let b of toDelete) {
                    await deleteDoc(doc(db, "bookings", b.id));
                }
            }
        };

        window.handleAddUser = async () => {
            const name = document.getElementById('newUserName').value.trim();
            if (name && !window.users.some(u => u.name === name)) {
                window.users.push({ name, role: 'user' });
                await window.saveSystemConfig();
                document.getElementById('newUserName').value = "";
            }
        };

        window.deleteUser = async (userName) => {
            window.users = window.users.filter(u => u.name !== userName);
            await window.saveSystemConfig();
        };
    </script>

    <!-- UI 邏輯 script -->
    <script>
        function updateAuthUI() {
            const userInfo = document.getElementById('userInfo');
            const authBtn = document.getElementById('authBtn');
            const adminPanel = document.getElementById('adminPanel');

            if (currentUser) {
                userInfo.innerText = `使用者：${currentUser.name} (${currentUser.role === 'admin' ? '管理員' : '一般人員'})`;
                authBtn.innerText = "登出";
                authBtn.onclick = handleLogout;
                adminPanel.classList.toggle('hidden', currentUser.role !== 'admin');
            } else {
                userInfo.innerText = "未登入";
                authBtn.innerText = "登入";
                authBtn.onclick = () => openModal('loginModal');
                adminPanel.classList.add('hidden');
            }
        }

        function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const foundUser = users.find(u => u.name === username);

            if (!foundUser) {
                alert("帳號不存在，請聯繫管理員！");
                return;
            }

            currentUser = foundUser;
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            updateAuthUI();
            closeModal('loginModal');
            document.getElementById('loginUsername').value = "";
            renderBookingList();
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            updateAuthUI();
            renderBookingList();
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('roomTabs');
            tabsContainer.innerHTML = rooms.map(room => `
                <button onclick="switchTab('${room}')" class="px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition ${activeRoom === room ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-slate-50'}">
                    ${room}
                </button>
            `).join('');
        }

        function switchTab(roomName) {
            activeRoom = roomName;
            renderTabs();
            renderCalendar();
            renderBookingList();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('calendarMonthYear').innerText = `${year} 年 ${month + 1} 月`;

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();

            const container = document.getElementById('calendarDays');
            container.innerHTML = "";

            const bookedDates = new Set(
                bookings.filter(b => b.room === activeRoom).map(b => b.date)
            );

            for (let i = 0; i < firstDay; i++) {
                container.innerHTML += `<div class="h-10"></div>`;
            }

            for (let date = 1; date <= lastDate; date++) {
                const monthStr = String(month + 1).padStart(2, '0');
                const dateStr = String(date).padStart(2, '0');
                const fullDateStr = `${year}-${monthStr}-${dateStr}`;

                const isSelected = fullDateStr === selectedDateStr;
                const hasBooking = bookedDates.has(fullDateStr);

                container.innerHTML += `
                    <button onclick="selectDate('${fullDateStr}')" class="h-10 rounded-xl flex flex-col items-center justify-center relative transition ${isSelected ? 'bg-indigo-600 text-white font-bold' : 'hover:bg-slate-100 text-slate-700'}">
                        <span>${date}</span>
                        ${hasBooking ? `<span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : 'bg-rose-500'} absolute bottom-1"></span>` : ''}
                    </button>
                `;
            }
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            renderCalendar();
            renderBookingList();
        }

        function renderBookingList() {
            document.getElementById('selectedDateTitle').innerText = selectedDateStr;
            const container = document.getElementById('bookingList');

            const filteredBookings = bookings
                .filter(b => b.room === activeRoom && b.date === selectedDateStr)
                .sort((a, b) => a.startTime.localeCompare(b.startTime));

            if (filteredBookings.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-slate-400 text-xs">當日無預約紀錄</div>`;
                return;
            }

            container.innerHTML = filteredBookings.map(b => {
                const isOwner = currentUser && currentUser.name === b.user;
                const isAdmin = currentUser && currentUser.role === 'admin';
                const canModify = isOwner || isAdmin;

                return `
                    <div class="border border-slate-100 bg-slate-50 rounded-xl p-3 flex justify-between items-center">
                        <div>
                            <div class="text-xs text-indigo-600 font-bold mb-0.5">${b.startTime} - ${b.endTime}</div>
                            <div class="text-sm font-semibold text-slate-800">${b.title}</div>
                            <div class="text-xs text-slate-400">預約人：${b.user}</div>
                        </div>
                        ${canModify ? `
                            <div class="space-x-1">
                                <button onclick="openBookingModal('${b.id}')" class="text-xs bg-slate-200 text-slate-700 px-2 py-1 rounded">編輯</button>
                                <button onclick="deleteBooking('${b.id}')" class="text-xs bg-rose-100 text-rose-600 px-2 py-1 rounded">刪除</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function openBookingModal(bookingId = null) {
            if (!currentUser) {
                alert("請先登入系統才能進行預約！");
                openModal('loginModal');
                return;
            }

            document.getElementById('bookingUser').value = currentUser.name;

            if (bookingId) {
                const target = bookings.find(b => b.id === bookingId);
                document.getElementById('bookingModalTitle').innerText = "編輯預約";
                document.getElementById('bookingId').value = target.id;
                document.getElementById('meetingTitle').value = target.title;
                document.getElementById('startTime').value = target.startTime;
                document.getElementById('endTime').value = target.endTime;
            } else {
                document.getElementById('bookingModalTitle').innerText = "新增預約";
                document.getElementById('bookingForm').reset();
                document.getElementById('bookingId').value = "";
                document.getElementById('bookingUser').value = currentUser.name;
            }
            openModal('bookingModal');
        }

        function openRoomMgmtModal() { renderRoomList(); openModal('roomMgmtModal'); }
        function renderRoomList() {
            const list = document.getElementById('roomList');
            if (!list) return;
            list.innerHTML = rooms.map((room, index) => `
                <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg border border-slate-200">
                    <span class="text-sm font-medium text-slate-700">${room}</span>
                    <div class="space-x-1">
                        <button onclick="editRoomName(${index})" class="text-xs bg-indigo-50 text-indigo-600 px-2 py-1 rounded font-medium">修改</button>
                        ${rooms.length > 1 ? `<button onclick="deleteRoom(${index})" class="text-xs bg-rose-50 text-rose-600 px-2 py-1 rounded font-medium">刪除</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function openUserMgmtModal() { renderUserList(); openModal('userMgmtModal'); }
        function renderUserList() {
            const list = document.getElementById('userList');
            if (!list) return;
            list.innerHTML = users.map(u => `
                <div class="flex justify-between items-center text-sm bg-slate-50 p-2 rounded">
                    <span>${u.name} <span class="text-xs text-slate-400">(${u.role})</span></span>
                    ${u.role !== 'admin' ? `<button onclick="deleteUser('${u.name}')" class="text-xs text-rose-500 hover:underline">刪除</button>` : ''}
                </div>
            `).join('');
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
